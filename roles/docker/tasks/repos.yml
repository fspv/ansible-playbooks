- name: repo dir keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: repo remove legacy key
  file:
    path: /etc/apt/trusted.gpg.d/docker.gpg
    state: absent

- name: repo key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: repo
  template:
    src: etc/apt/sources.list.d/docker-ce.list
    dest: /etc/apt/sources.list.d/docker-ce.list
  notify:
    - apt-get update

- name: repo
  template:
    src: etc/apt/preferences.d/docker-ce.pref.j2
    dest: /etc/apt/preferences.d/docker-ce.pref
  notify:
    - apt-get update

- meta: flush_handlers
