---
- name: repo dir keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: repo remove legacy key
  file:
    path: /etc/apt/trusted.gpg.d/tuxedo.gpg
    state: absent

- name: repo key
  get_url:
    url: https://deb.tuxedocomputers.com/0x54840598.pub.asc
    dest: /etc/apt/keyrings/tuxedo.asc
    mode: '0644'

- name: repo pins
  copy:
    dest: /etc/apt/preferences.d/tuxedo.pref
    content: |
      Package: *
      Pin: origin mirrors.tuxedocomputers.com
      Pin-Priority: 1

      Package: *
      Pin: origin deb.tuxedocomputers.com
      Pin-Priority: 1

      Package: linux-*
      Pin: origin mirrors.tuxedocomputers.com
      Pin-Priority: 995

      Package: tuxedo-*
      Pin: origin mirrors.tuxedocomputers.com
      Pin-Priority: 995

      Package: amd64-microcode
      Pin: origin mirrors.tuxedocomputers.com
      Pin-Priority: 995

      Package: linux-*
      Pin: origin deb.tuxedocomputers.com
      Pin-Priority: 995

      Package: tuxedo-*
      Pin: origin deb.tuxedocomputers.com
      Pin-Priority: 995

      Package: amd64-microcode
      Pin: origin deb.tuxedocomputers.com
      Pin-Priority: 995

- name: repos
  copy:
    dest: /etc/apt/sources.list.d/tuxedo-computers.list
    content: |
      deb [signed-by=/etc/apt/keyrings/tuxedo.asc] https://deb.tuxedocomputers.com/ubuntu {{ ansible_distribution_release }} main
  notify:
    - apt-get update

- meta: flush_handlers
