- name: repo ppa-et pins
  template:
    src: etc/apt/preferences.d/ppa-et.pref.j2
    dest: /etc/apt/preferences.d/ppa-et.pref
  when: ansible_distribution == "Ubuntu"

- name: repo
  template:
    src: etc/apt/sources.list.d/ppa-et.list.j2
    dest: /etc/apt/sources.list.d/ppa-et.list
  notify:
    - apt-get update
  when: ansible_distribution == "Ubuntu"

- name: repo dir keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_distribution == "Ubuntu"

- name: repo remove legacy key
  file:
    path: /etc/apt/trusted.gpg.d/ppa-et.gpg
    state: absent
  when: ansible_distribution == "Ubuntu"

- name: repo key
  get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0xD3614CB0B3C2D154356BD436CB4ADEA5B72A07A1"
    dest: /etc/apt/keyrings/ppa-et.asc
    mode: '0644'
  notify:
    - apt-get update
  when: ansible_distribution == "Ubuntu"

- meta: flush_handlers
  when: ansible_distribution == "Ubuntu"
